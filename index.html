<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaceParts Performance | Peças & Tuning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>Race<span>Parts</span></h1>
        </div>
        <div class="cart-icon" onclick="toggleCart()">
            🛒 Carrinho (<span id="cart-count">0</span>)
        </div>
    </header>

    <section class="banner">
        <h2>As Melhores Peças Performance para o Seu Projeto</h2>
        <p>Injeções programáveis, pneus slick, turbinas e muito mais!</p>
    </section>

    <main class="products-grid" id="products-grid">
        </main>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeProductModal()">&times;</span>
            <div class="modal-body">
                <img id="modal-img" src="" alt="Produto">
                <div class="modal-info">
                    <h2 id="modal-title"></h2>
                    <p id="modal-description"></p>
                    <h3 id="modal-price"></h3>
                    <button id="modal-add-btn" class="btn-primary">Adicionar ao Carrinho</button>
                </div>
            </div>
        </div>
    </div>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleCart()">&times;</span>
            <h2>Seu Carrinho</h2>
            <div id="cart-items">
                </div>
            <div class="cart-summary">
                <h3>Total: R$ <span id="cart-total">0.00</span></h3>
            </div>

            <div class="payment-section">
                <h3>Forma de Pagamento</h3>
                <label>
                    <input type="radio" name="payment" value="pix" checked onclick="selectPayment('pix')"> Pix (5% de Desconto)
                </label>
                <label>
                    <input type="radio" name="payment" value="card" onclick="selectPayment('card')"> Cartão de Crédito
                </label>

                <div id="payment-details" class="payment-details">
                    <p><strong>Chave Pix:</strong> contato@raceparts.com.br</p>
                </div>
            </div>

            <button class="btn-success" onclick="checkout()">Finalizar Compra</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
